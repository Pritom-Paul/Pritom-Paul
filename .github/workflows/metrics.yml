name: Metrics
on:
  # Refresh stats daily
  schedule: [{cron: "0 0 * * *"}]
  # Allow manual re-run from the Actions tab
  workflow_dispatch:
  # Refresh right after you push a new README
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          # Core stats: activity, top languages, repo/star counts
          base: header, activity, community, repositories
          config_timezone: Asia/Dhaka
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_lines: yes
